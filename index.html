<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Test App</title>
  
  <!-- The crucial manifest link for GitHub Pages -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- iOS support tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2201/2201573.png">

  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h1 { color: #00bcd4; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Learning Hub Test</h1>
    <p>If you see "Install App" in Chrome's menu, your setup is officially 100% correct!</p>
  </div>

  <!-- Service Worker Registration Script -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered Successfully!', reg))
          .catch(err => console.error('Service Worker Registration Failed!', err));
      });
    }
  </script>
</body>
</html>
